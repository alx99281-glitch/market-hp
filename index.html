<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Analysis Dashboard</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); display: flex; flex-direction: column;
    font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  header {
    padding: 14px 20px 0; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  h1 { font-size: 1.2rem; margin: 0 0 12px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab-btn {
    background: transparent; border: 1px solid var(--border); border-bottom: none;
    color: var(--muted); padding: 10px 20px; border-radius: 8px 8px 0 0; cursor: pointer;
    font-size: 0.92rem; font-weight: 500;
  }
  .tab-btn.active { background: var(--panel); color: var(--text); border-color: var(--border); }
  main { flex: 1; min-height: 0; }
  iframe { width: 100%; height: 100%; border: none; display: block; background: var(--bg); }
</style>
</head>
<body>
  <header>
    <h1>Market Analysis Dashboard</h1>
    <div class="tabs">
      <button class="tab-btn active" id="tab-insights" onclick="switchTab('insights')">💡 Insights</button>
      <button class="tab-btn" id="tab-asia" onclick="switchTab('asia')">🌏 Japan &amp; Asia</button>
      <button class="tab-btn" id="tab-chart" onclick="switchTab('chart')">📈 Market Charts</button>
      <button class="tab-btn" id="tab-board" onclick="switchTab('board')">🏛️ Central Bank Boards</button>
    </div>
  </header>


  <main>
    <iframe id="content" src="insights/output/index.html"></iframe>
  </main>

<script>
const PAGES = {
  insights: 'insights/output/index.html',
  asia: 'insights/output/asia/index.html',
  chart: 'charts/output/index.html',
  board: 'boards/output/index.html',
};

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.toggle('active', el.id === 'tab-' + tab));
  document.getElementById('content').src = PAGES[tab];
}
</script>
</body>
</html>
