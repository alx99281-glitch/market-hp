name: Daily market update

# ローカルPC（スリープ中が多い）に依存せず、GitHub側のクラウド実行環境だけで
# 完結させる。日本市場引け後・米国市場引け後の2回、価格データ取得→レポート
# 生成→pushまでを自動で行う（daily-review/README.md の手動手順と同じ内容）。
on:
  schedule:
    - cron: "0 7 * * 1-5"   # JST 15:00引け -> 16:00頃(UTC 07:00)に実行
    - cron: "30 21 * * 1-5" # NY 16:00引け付近(UTC 20:00-21:00)を跨いで安全側の30分後
  workflow_dispatch: {}      # 手動実行用（Actionsタブから「Run workflow」で即時実行可）

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r daily-review/requirements.txt

      - name: Run daily pipeline (US + JP)
        working-directory: daily-review/src
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run_daily.py --all

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" || git commit -m "Automated daily update ($(date -u +%Y-%m-%d))"
          git push
