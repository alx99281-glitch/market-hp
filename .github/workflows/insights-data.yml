name: Insights market data

# クラウド定期実行は Yahoo Finance に接続できないため、ここでデータを取得して
# market-data ブランチに置く。main の履歴を増やさないよう、毎回1コミットで上書きする。
# scheduleは遅れて起動することがあるので、それぞれ2回実行する。
#   米国(06:00 SGT の号用): NY引け(冬時間 21:00 UTC)の後
#   日本・アジア(18:00 SGT の号用): アジアの引け(16:00 SGT)の後
# JPXの信用取引残高・投資部門別売買状況も毎回取得し、前回分に足して履歴を伸ばす。
on:
  schedule:
    - cron: "15 21 * * 1-5"
    - cron: "40 21 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r daily-review/requirements.txt pdfplumber openpyxl xlrd

      - name: Restore previous market-data
        run: |
          mkdir -p "$RUNNER_TEMP/prev"
          if git fetch -q origin market-data; then git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/prev"; fi

      - name: Fetch market data
        run: python insights/src/fetch_market_data.py "$RUNNER_TEMP/market-data"

      - name: Compute signals
        run: |
          python insights/src/compute_signals.py > /dev/null
          cp insights/data/signals.json "$RUNNER_TEMP/market-data/signals.json"

      - name: Fetch JPX margin and investor data
        continue-on-error: true
        run: |
          python insights/src/fetch_jpx.py "$RUNNER_TEMP/market-data" "$RUNNER_TEMP/prev"
          python insights/src/margin_report.py "$RUNNER_TEMP/market-data"

      - name: Keep previous JPX files if this run could not make them
        run: |
          for f in margin_stock_daily.parquet margin_weekly.parquet investor_weekly.parquet jp_names.json margin_report.json; do
            [ -f "$RUNNER_TEMP/market-data/$f" ] || cp "$RUNNER_TEMP/prev/$f" "$RUNNER_TEMP/market-data/" 2>/dev/null || true
          done

      - name: Publish to market-data branch
        working-directory: ${{ runner.temp }}/market-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b market-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Market data $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" market-data
